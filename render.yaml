# REVIEW BEFORE APPLY: Web + Cron + PostgreSQL are PAID resources.
# No resources are created by committing this file. Provider calls default to disabled.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: "off"
envVarGroups:
  - name: rentalsourcing-runtime
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: APP_ENV
        value: production
      - key: CITY_BOUNDARY_FILE
        value: data/pittsburgh.geojson
      - key: API_APPROVAL_MODE
        value: one_time
      - key: APPROVED_API_REQUESTS
        value: "0"
      - key: MAX_API_REQUESTS_PER_RUN
        value: "4"
      - key: MAX_API_REQUESTS_PER_DAY
        value: "4"
      - key: MAX_API_REQUESTS_PER_MONTH
        value: "40"
      - key: BILLING_DAY
        value: "1"
      - key: LISTING_LIMIT
        value: "500"
      - key: MAX_LISTING_PAGES
        value: "20"
      - key: TAX_CACHE_HOURS
        value: "168"
      - key: LISTING_CACHE_MINUTES
        value: "15"
      - key: HTTP_TIMEOUT_SECONDS
        value: "30"
      - key: NETWORK_RETRIES
        value: "0"
services:
  - type: web
    name: rentalsourcing-dashboard
    runtime: python
    repo: https://github.com/guypenso/gps14
    branch: master
    autoDeployTrigger: checksPass
    plan: starter
    region: virginia
    buildCommand: "pip install -r requirements.txt && python -m rentalsourcing.cloud --check"
    startCommand: "sh scripts/start_web.sh"
    healthCheckPath: /healthz
    envVars:
      - fromGroup: rentalsourcing-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: rentalsourcing-db
          property: connectionString
      - key: DASHBOARD_USERNAME
        value: owner
      - key: DASHBOARD_PASSWORD
        generateValue: true
  - type: cron
    name: rentalsourcing-daily
    runtime: python
    repo: https://github.com/guypenso/gps14
    branch: master
    autoDeployTrigger: checksPass
    plan: starter
    region: virginia
    schedule: "0 12,13 * * *"
    buildCommand: "pip install -r requirements.txt && python -m rentalsourcing.cloud --check"
    startCommand: "python -m rentalsourcing.cloud --scheduled"
    envVars:
      - fromGroup: rentalsourcing-runtime
      - key: ENABLE_RENTCAST
        value: "false"
      - key: ENABLE_EMAIL
        value: "false"
      # Add RENTCAST_API_KEY, RESEND_API_KEY, EMAIL_FROM and EMAIL_TO privately
      # on this service before activation. Disabled providers need no secrets
      # during initial Blueprint creation or the build/health checks.
      - key: DATABASE_URL
        fromDatabase:
          name: rentalsourcing-db
          property: connectionString
databases:
  - name: rentalsourcing-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: virginia
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
