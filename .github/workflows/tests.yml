name: Offline and PostgreSQL integration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-tests-only
          POSTGRES_DB: rentalsourcing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-tests-only@localhost:5432/rentalsourcing_test
      ENABLE_RENTCAST: 'false'
      ENABLE_EMAIL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Retrieve authoritative neighborhood release data
        if: github.ref_name == 'codex/hazelwood-mount-washington-20261103' || github.head_ref == 'codex/hazelwood-mount-washington-20261103'
        run: python scripts/fetch_regions.py data hazelwood mount-washington
      - name: Read validated public boundary inputs
        if: github.head_ref == 'codex/hazelwood-mount-washington-20261103'
        run: python -c "import pathlib,base64; [print('PUBLIC_BOUNDARY_INPUT '+p.name+' '+base64.b64encode(p.read_bytes()).decode()) for p in sorted(pathlib.Path('data').glob('*')) if p.name.startswith(('hazelwood.','mount-washington.'))]"
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'codex/hazelwood-mount-washington-20261103' || github.head_ref == 'codex/hazelwood-mount-washington-20261103'
        with:
          name: verified-neighborhood-polygons
          path: |
            data/hazelwood.*
            data/mount-washington.*
      - run: python -m pytest -q
