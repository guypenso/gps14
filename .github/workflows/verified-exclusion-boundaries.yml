name: Retrieve official exclusion boundaries
on:
  push:
    branches: [codex/neighborhood-condo-exclusions-20261103]
    paths: [scripts/fetch_regions.py, .github/workflows/verified-exclusion-boundaries.yml]
  pull_request:
    paths: [scripts/fetch_regions.py, .github/workflows/verified-exclusion-boundaries.yml]
permissions:
  contents: write
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/neighborhood-condo-exclusions-20261103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python scripts/fetch_regions.py data perry-south elliott carrick
      - name: Save verified public polygons on review branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/perry-south.geojson data/perry-south.source.json data/elliott.geojson data/elliott.source.json data/carrick.geojson data/carrick.source.json
          git diff --cached --quiet || git commit -m 'Bundle checked official exclusion boundaries'
          git push origin HEAD:codex/neighborhood-condo-exclusions-20261103
      - uses: actions/upload-artifact@v4
        with:
          name: verified-exclusion-boundaries
          path: |
            data/perry-south.*
            data/elliott.*
            data/carrick.*
          retention-days: 3
